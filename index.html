<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waldiz-AR</title>
    <link rel="stylesheet" href="css/style.css?v=3">

    <!-- 
      importacao do a-frame e dos pacotes de geolocalizacao do ar.js 3.4.7.
    -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- o threex-location precisa carregar antes do aframe-ar, senao o componente gps-new-camera nao registra na cena -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body>

    <!-- 
      painel de diagnostico pra acompanhar em campo se o gps ja estabilizou a precisao
      e se o arquivo glb ja terminou de baixar no 4g.
    -->
    <div id="hud-status">
        <div id="hud-gps">GPS: aguardando sensor...</div>
        <div id="hud-precisao">Precisão: --</div>
        <div id="hud-modelo">Modelo: aguardando GPS...</div>
    </div>

    <!-- 
      caixa de descricao e narracao que so aparece quando o usuario entra no raio de 50m da obra.
      fica presa na parte de baixo da tela pra deixar o centro livre pro modelo 3d.
    -->
    <div id="caixa-obra" class="escondido">
        <div id="topo-caixa">
            <span id="titulo-obra">Nome da Obra</span>
            <!-- navegadores mobile bloqueiam autoplay de audio, entao o disparo precisa vir do clique direto nesse botao -->
            <button id="btn-audio" type="button">Play Audio</button>
        </div>
        <p id="texto-descricao"></p>
        <audio id="audio-narracao" preload="none"></audio>
    </div>

    <!-- 
      cena principal configurada pra webar. 
      o videoTexture e o logarithmicDepthBuffer evitam que o modelo suma de longe ou fique piscando as faces.
    -->
    <a-scene 
        vr-mode-ui="enabled: false"
        xr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true">

        <a-assets>
            <a-asset-item id="glb-casa-fazenda" src="assets/models/casa-fazenda.glb"></a-asset-item>
            <a-asset-item id="glb-hotel-nsf" src="assets/models/hotel-nsf.glb"></a-asset-item>
            <a-asset-item id="glb-prefeitura-antiga" src="assets/models/prefeitura-antiga.glb"></a-asset-item>
        </a-assets>

        <!-- 
          camera da api nova de localizacao. 
          no a-frame 1.6 precisa desligar o look-controls padrao e usar o arjs-device-orientation-controls pra bussola alinhar com o norte.
        -->
        <a-camera 
            look-controls-enabled="false"
            arjs-device-orientation-controls="smoothingFactor: 0.1"
            gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 100">
        </a-camera>

    </a-scene>

    <!-- importacao do script principal como modulo javascript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
